name: RdpFree — RDP 6 Jam
on:
  workflow_dispatch:
    inputs:
      durasi_menit:
        description: "Durasi sesi (menit). 6 jam pas = 360"
        required: false
        default: "360"
        type: choice
        options:
          - "15"
          - "30"
          - "60"
          - "120"
          - "180"
          - "240"
          - "300"
          - "330"
          - "360"
      hostname:
        description: "Hostname sesi (dapat suffix nomor run, mis: xyrdp-42)"
        required: false
        default: "xyrdp-samp"
        type: string
      rdp_user:
        description: "Username login RDP (3–20 karakter, huruf/angka/_/-)"
        required: false
        default: "xyadmin"
        type: string
      akses:
        description: "Jalur akses: tunnel (langsung host:port untuk XyDesk Remote/mstsc), tailscale (100.x), atau semua (keduanya)"
        required: false
        default: "tunnel"
        type: choice
        options:
          - "tunnel"
          - "tailscale"
          - "semua"
      tunnel_provider:
        description: "Provider tunnel RDP (kalau akses pakai tunnel)"
        required: false
        default: "otomatis"
        type: choice
        options:
          - "otomatis"
          - "pinggy"
          - "bore"
          - "ngrok"
          - "localhost.run"
          - "serveo"
      storage_boost:
        description: "⚡ Storage Boost: bebaskan 45-75GB (70GB -> 120GB+ free) dengan hapus Android/Haskell/CodeQL/cache"
        required: false
        default: "ya"
        type: choice
        options:
          - "ya"
          - "tidak"
      debloat:
        description: "🧹 Debloat: hapus app bawaan gede (ringan=OneDrive/Xbox/Appx, full=+Edge ~1.5GB). Edge dihapus hanya jika Chrome ada"
        required: false
        default: "ringan"
        type: choice
        options:
          - "ringan"
          - "full"
          - "tidak"
      samp:
        description: "🎮 GTA SAMP: pasang SA-MP client + dependensi DirectX/VC++ (butuh GTA_SA_URL atau upload manual)"
        required: false
        default: "ya"
        type: choice
        options:
          - "ya"
          - "tidak"
      samp_extra:
        description: "🎮 Extra SAMP: SilentPatch + WidescreenFix (rekomendasi ya untuk SAMP)"
        required: false
        default: "tidak"
        type: choice
        options:
          - "ya"
          - "tidak"
      gta_sa_url:
        description: "(OPSIONAL) URL direct ZIP GTA SA portable milikmu (Google Drive direct / Dropbox / S3). Kosong = upload manual via RDP"
        required: false
        default: ""
        type: string
      win10:
        description: "Tweak tampilan Windows 10 (Server Manager mati, personalisasi, wallpaper, label)"
        required: false
        default: "ya"
        type: choice
        options:
          - "ya"
          - "tidak"
      xydesk:
        description: "Host setup XyDesk Remote (AVC444 + ClearType + multi-session + audio/mic + UDP 4433)"
        required: false
        default: "ya"
        type: choice
        options:
          - "ya"
          - "tidak"
      ekstra:
        description: "Ekstra otomatis: Lightshot + wallpaper + taskbar translucent"
        required: false
        default: "ya"
        type: choice
        options:
          - "ya"
          - "tidak"
      grafis:
        description: "GPU software: Mesa3D llvmpipe (OpenGL 4.5+/4.6) + lavapipe Vulkan — WAJIB ya untuk GTA SAMP"
        required: false
        default: "software"
        type: choice
        options:
          - "software"
          - "tidak"
      wallpaper_url:
        description: "(OPSIONAL) URL wallpaper sendiri (jpg/png/bmp). Kosong = pakai assets/wallpaper*.jpg"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

# Satu sesi aktif. Run kedua antre, bukan barengan.
concurrency:
  group: xyrdp
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      DUR: ${{ inputs.durasi_menit }}
      HOSTNAME: ${{ inputs.hostname }}
      AKSES: ${{ inputs.akses }}
      TUNNEL_PROVIDER: ${{ inputs.tunnel_provider }}
      WIN10: ${{ inputs.win10 }}
      XYDESK: ${{ inputs.xydesk }}
      EXTRAS: ${{ inputs.ekstra }}
      GRAFIS: ${{ inputs.grafis }}
      WALLPAPER_URL: ${{ inputs.wallpaper_url }}
      RDP_USER: ${{ inputs.rdp_user || 'xyadmin' }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
      KEEP_RUNS: "3"
      GITHUB_TOKEN: ${{ github.token }}
      # --- SAMP MOD ---
      STORAGE_BOOST: ${{ inputs.storage_boost }}
      DEBLOAT: ${{ inputs.debloat }}
      SAMP: ${{ inputs.samp }}
      SAMP_EXTRA: ${{ inputs.samp_extra }}
      GTA_SA_URL: ${{ inputs.gta_sa_url }}
      # juga izinkan override via secrets untuk URL panjang
      GTA_SA_URL_SECRET: ${{ secrets.GTA_SA_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Info lingkungan (OS + versi + disk awal)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "[RdpFree] OS runner : $($os.Caption) build $($os.Version)"
          Write-Host "[RdpFree] Storage awal:"
          Get-CimInstance Win32_LogicalDisk | ForEach-Object { Write-Host "  $($_.DeviceID) $([math]::Round($_.Size/1GB,1))GB total / $([math]::Round($_.FreeSpace/1GB,1))GB free" }
          Write-Host "[RdpFree] Catatan: storage_boost=$env:STORAGE_BOOST samp=$env:SAMP samp_extra=$env:SAMP_EXTRA"

      - name: ⚡ Boost Storage (225GB -> lega 120GB+ free)
        if: ${{ inputs.storage_boost != 'tidak' }}
        timeout-minutes: 15
        continue-on-error: true
        shell: pwsh
        run: ./scripts/optimize-storage.ps1

      - name: Setup dasar (user admin + RDP 3389)
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/setup-rdp.ps1

      - name: Tweak tampilan Windows 10 (Server Manager, personalisasi, wallpaper)
        if: ${{ inputs.win10 != 'tidak' }}
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/setup-win10.ps1

      - name: Host setup XyDesk Remote (AVC444 + ClearType + audio/mic + UDP 4433)
        if: ${{ inputs.xydesk != 'tidak' }}
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/setup-xydesk.ps1

      - name: Setup grafis (GPU software - Mesa3D llvmpipe + lavapipe) — WAJIB untuk SAMP
        if: ${{ inputs.grafis != 'tidak' }}
        timeout-minutes: 12
        continue-on-error: true
        shell: pwsh
        run: ./scripts/setup-grafis.ps1

      - name: Setup tampilan, wallpaper, dan editor coding opsional
        if: ${{ inputs.ekstra != 'tidak' }}
        timeout-minutes: 20
        continue-on-error: true
        shell: pwsh
        run: ./scripts/setup-extras.ps1

      - name: 🎮 Setup GTA SAMP (SA-MP + DirectX + VC++)
        if: ${{ inputs.samp != 'tidak' }}
        timeout-minutes: 40
        continue-on-error: true
        shell: pwsh
        run: |
          # fallback: jika input gta_sa_url kosong tapi secret GTA_SA_URL ada, pakai secret
          if (-not $env:GTA_SA_URL -and $env:GTA_SA_URL_SECRET) { $env:GTA_SA_URL = $env:GTA_SA_URL_SECRET }
          ./scripts/setup-samp.ps1

      - name: Setup akses (Tunnel RDP + Tailscale) — TANPA RustDesk
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/setup-akses.ps1

      - name: Publish status ke branch 'status'
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/publish-status.ps1 -Active $true

      - name: Roblox VM Hide (biar Player tidak deteksi VM)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/setup-roblox.ps1

      - name: "Tampilkan IP Username Password (log) — VALIDASI TUNNEL"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          Write-Host "=== LIST KONEKSI RDP (cek log ini) — VALIDASI TUNNEL UNTUK XYDESK REMOTE ==="
          $st = $null
          if (Test-Path 'out/rdp-status.json') {
            $st = Get-Content 'out/rdp-status.json' -Raw | ConvertFrom-Json
            $tun = $st.akses.tunnel.address
            $tunProv = $st.akses.tunnel.provider
            $tunSelf = $st.akses.tunnel.selftest
            $tunOutside = $st.akses.tunnel.outside
            $tsIp = $null; try { $tsIp = $st.akses.tailscale.ip } catch {}
            $tsMagic = $null; try { $tsMagic = $st.akses.tailscale.magicdns } catch {}
            Write-Host "  Tunnel      : $tun  [$tunProv] selftest=$tunSelf outside=$tunOutside"
            if ($tsIp) { Write-Host "  Tailscale IP: $tsIp ($tsMagic)" }
            Write-Host "  Username    : $env:RDP_USER"
            # Password di-mask GitHub jadi *** — tampilkan juga base64 biar bisa di-copy tanpa mask
            Write-Host "  Password    : $env:RDP_PASSWORD"
            $b64pw = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:RDP_PASSWORD))
            Write-Host "  Password b64: $b64pw  (decode: [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('$b64pw')))"
            Write-Host "  Hostname    : $($st.hostname)"
            Write-Host "  Durasi      : $($st.duration_menit) menit"
            Write-Host "  RDP port    : $($st.rdp_port)"
            # Validasi tunnel: test handshake ulang dari log step ini
            if ($tun -and $tun -match '^(?<h>[^:]+):(?<p>\d+)$') {
              $h = $Matches['h']; $p = [int]$Matches['p']
              Write-Host "  VALIDASI: handshake X.224 ke $h`:$p ..."
              try {
                $cr = [byte[]](0x03,0x00,0x00,0x13,0x0e,0xe0,0x00,0x00,0x00,0x00,0x00,0x01,0x00,0x08,0x00,0x03,0x00,0x00,0x00)
                $c = New-Object System.Net.Sockets.TcpClient
                if ($c.ConnectAsync($h,$p).Wait(8000)) {
                  $ns=$c.GetStream(); $ns.Write($cr,0,$cr.Length); $ns.Flush()
                  $c.ReceiveTimeout=8000; $buf=New-Object byte[] 32; $n=$ns.Read($buf,0,32); $c.Close()
                  if ($n -ge 6 -and $buf[5] -in @(0xd0,0xcf)) { Write-Host "  VALIDASI OK: X.224 Confirm ($n bytes) — TUNNEL LANGSUNG BISA DIPAKAI DI XYDESK REMOTE / mstsc" }
                  else { Write-Host "  VALIDASI GAGAL: balasan $n bytes tidak valid" }
                } else { Write-Host "  VALIDASI GAGAL: timeout connect ke $h`:$p"; $c.Close() }
              } catch { Write-Host "  VALIDASI ERROR: $($_.Exception.Message)" }
            }
            # Tulis creds.txt + creds.b64.txt
            "RDP $env:RDP_USER / $env:RDP_PASSWORD @ $tun [$tunProv] selftest=$tunSelf outside=$tunOutside" | Set-Content -Path 'out/creds.txt' -Encoding utf8
            "RDP $env:RDP_USER / $b64pw(b64) @ $tun" | Set-Content -Path 'out/creds.b64.txt' -Encoding utf8
            Write-Host "  creds.txt + creds.b64.txt dibuat di out/"
            $st | ConvertTo-Json -Depth 8 | Write-Host
          } else {
            Write-Host "  out/rdp-status.json belum ada"
            Write-Host "  Username: $env:RDP_USER"
            Write-Host "  Password: $env:RDP_PASSWORD"
          }
          Write-Host "::notice::RDP $env:RDP_USER @ $tun [$tunProv] selftest=$tunSelf outside=$tunOutside"

      - name: Info SAMP & Storage akhir (ringkasan)
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "=== RINGKASAN STORAGE & SAMP ==="
          Get-CimInstance Win32_LogicalDisk | ForEach-Object { Write-Host "  $($_.DeviceID) $([math]::Round($_.Size/1GB,1))GB total / $([math]::Round($_.FreeSpace/1GB,1))GB free" }
          if (Test-Path 'C:\Games\GTA San Andreas\gta_sa.exe') { Write-Host "  GTA SA: ADA di C:\Games\GTA San Andreas" } elseif (Test-Path 'D:\Games\GTA San Andreas\gta_sa.exe') { Write-Host "  GTA SA: ADA di D:\Games\GTA San Andreas" } else { Write-Host "  GTA SA: BELUM (upload manual / cek GTA_SA_URL)" }
          if (Test-Path 'C:\Games\GTA San Andreas\samp.exe') { Write-Host "  SAMP: ADA (samp.exe)" } elseif (Test-Path 'D:\Games\GTA San Andreas\samp.exe') { Write-Host "  SAMP: ADA di D:\Games" } else { Write-Host "  SAMP: cek log setup-samp" }
          $st = Get-Content out/rdp-status.json -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          if ($st.storage) { Write-Host "  Storage boost: $($st.storage.before_gb)GB -> $($st.storage.after_gb)GB (+$($st.storage.gained_gb)GB)" }
          if ($st.samp) { Write-Host "  SAMP status: $($st.samp.status) - $($st.samp.note)" }
          if ($st.akses) { Write-Host "  Akses tunnel: $($st.akses.tunnel.address) [$($st.akses.tunnel.provider)] selftest=$($st.akses.tunnel.selftest) outside=$($st.akses.tunnel.outside)" }
          if ($st.akses.tailscale.ip) { Write-Host "  Tailscale: $($st.akses.tailscale.ip)" }

      - name: Tahan sesi sampai durasi habis
        shell: pwsh
        run: ./scripts/keepalive.ps1

      - name: Finalize (matikan akses, bersihkan status, hapus run lama)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          ./scripts/publish-status.ps1 -Active $false
          ./scripts/finalize-rdp.ps1
          ./scripts/cleanup-actions.ps1
